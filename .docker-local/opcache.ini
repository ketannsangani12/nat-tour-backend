; Local-only OPcache tuning, mounted into conf.d via docker-compose.local.yml.
; conf.d files load alphabetically, so this "zz-" file overrides app.ini and does
; NOT touch the shared .docker/php.ini used by deployment.
;
; This app has ~42,000 PHP files. The engine defaults (max_accelerated_files=10000,
; memory=128M) can only cache a fraction of them, so opcache constantly evicts and
; recompiles on web requests. These raise the cache to hold the whole app.
opcache.enable = 1
opcache.max_accelerated_files = 60000
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 32
; local dev: keep timestamp validation so code edits are picked up immediately.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
; realpath cache for the large project tree.
realpath_cache_size = 8M
realpath_cache_ttl = 600