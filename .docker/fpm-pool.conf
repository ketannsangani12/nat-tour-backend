[www]
user = www-data
group = www-data

; Dynamic process management
pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10

; Recycle workers after 2000 requests to prevent memory leaks
pm.max_requests = 2000

; Kill a web request that hangs beyond 5 minutes (web requests only, not CLI)
request_terminate_timeout = 300

; Log slow requests taking more than 5 seconds
request_slowlog_timeout = 5
slowlog = /var/log/php/slow.log
