name: Pull Request Actions

on:
  pull_request:
    branches:
      - development
      - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: write-all
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: .docker-cicd/composer-cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Build and run tests (shard ${{ matrix.shard }}/4)
        env:
          TEST_SHARD_INDEX: ${{ matrix.shard }}
          TEST_SHARD_TOTAL: 4
        run: |
          docker compose -f docker-compose-cicd.yml up --build --remove-orphans --exit-code-from tour_backend_cicd
